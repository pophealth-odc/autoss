<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Capture screenshots of web pages with Microsoft Edge on your own computer and browse them in a local gallery." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Screenshot Gallery</title>
    <script>
      // Apply the saved theme before the first paint so there is no flash of the wrong colours.
      try {
        var t = localStorage.getItem('ssg.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This application needs JavaScript. It controls a small program on your own computer to capture screenshots.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
